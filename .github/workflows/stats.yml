# Collects the app's public statistics into this repository's `data`
# branch, signs every file it writes, and redeploys the site, whose Stats
# page shows them (scripts/build-stats.sh).
#
# Every hour, the counts of the last 7 days (scripts/collect-stats.sh
# counts); once a day, also the costs (Cost Explorer charges $0.01 a call).
# It reads AWS through read-only roles that only this repository's `stats`
# environment may assume (the code repository's
# infra/init/stats_reader.tf), which takes only main. Without a role's
# secret, that account is skipped.
#
# When an account moves to another AWS organization, its costs are read only
# from the day of the move (COSTS_FROM in scripts/collect-stats.sh). A cost
# run after the move without it would overwrite last month's and this
# month's costs with what the new organization shows: nothing before the
# move. So:
# - Move once that day's cost run (05:50 UTC, often later) has finished:
#   check Actions, or run it by hand with costs.
# - Right after the move, before the next cost run, set the account's
#   STATS_COSTS_FROM_PRODUCTION or STATS_COSTS_FROM_DEV, a variable of the
#   stats environment, to the move's date (UTC). The day of the move then
#   holds only its hours after the move.
# - Leave it set. While a month in the last two has a -from- file that the
#   variable doesn't name (a corrected date, or the variable removed), cost
#   runs refuse to write.
# - A wrong date: correct it, delete from the data branch the
#   <yyyy-mm>-from-<dd>.json file it wrote, and restore from the branch's
#   history any month file a run rewrote. Same for a run that slipped through
#   before the variable was set.
#
# Anyone can check a file of the data branch:
#
#   gh attestation verify <file> --repo incognitochat-web/website \
#     --cert-identity https://github.com/incognitochat-web/website/.github/workflows/stats.yml@refs/heads/main
#
# Only scheduled and manual runs: the role trusts any job in the stats
# environment, so this workflow must never run on pull_request_target,
# workflow_run or issue_comment.
name: Collect statistics

on:
  schedule:
    - cron: '25 * * * *'
    - cron: '50 5 * * *'
  workflow_dispatch:
    inputs:
      costs:
        description: Also read costs (Cost Explorer charges $0.01 a call)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    name: Collect
    # Only on its schedule or by hand, from main: the role trusts any job in
    # the stats environment.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stats
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      COSTS: ${{ github.event.schedule == '50 5 * * *' || inputs.costs == true }}
      HAS_PRODUCTION: ${{ secrets.STATS_ROLE_ARN_PRODUCTION != '' }}
      HAS_DEV: ${{ secrets.STATS_ROLE_ARN_DEV != '' }}
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      # Read without credentials (the repository is public); the token is
      # used only to push, in the last step. A new data branch starts empty.
      - name: Get the data branch
        run: |
          # Exit code 2 alone means the branch doesn't exist; any other
          # failure (the network) stops the run.
          status=0
          git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/data >/dev/null || status=$?
          case $status in
            0) git clone --quiet --single-branch --branch data "https://github.com/${GITHUB_REPOSITORY}.git" store ;;
            2) echo "No data branch yet: starting one"
               git init --quiet --initial-branch data store ;;
            *) echo "Couldn't reach the repository to read the data branch"; exit 1 ;;
          esac

      # Each read may fail on its own; what the others read is still saved,
      # and the job fails at the end.
      - name: Production credentials
        id: prod-creds
        if: env.HAS_PRODUCTION == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.STATS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ vars.STATS_REGION_PRODUCTION }}
          role-session-name: website-stats
          mask-aws-account-id: true

      - name: Production counts
        id: prod-counts
        if: env.HAS_PRODUCTION == 'true' && steps.prod-creds.outcome == 'success'
        continue-on-error: true
        env:
          NAMESPACE: ${{ vars.STATS_NAMESPACE_PRODUCTION }}
        run: site/scripts/collect-stats.sh counts store

      - name: Production costs
        id: prod-costs
        if: env.HAS_PRODUCTION == 'true' && env.COSTS == 'true' && steps.prod-creds.outcome == 'success'
        continue-on-error: true
        env:
          COSTS_FROM: ${{ vars.STATS_COSTS_FROM_PRODUCTION }}
        run: site/scripts/collect-stats.sh costs production store

      - name: Dev credentials
        id: dev-creds
        if: env.HAS_DEV == 'true' && env.COSTS == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.STATS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.STATS_REGION_DEV }}
          role-session-name: website-stats
          mask-aws-account-id: true

      - name: Dev costs
        id: dev-costs
        if: env.HAS_DEV == 'true' && env.COSTS == 'true' && steps.dev-creds.outcome == 'success'
        continue-on-error: true
        env:
          COSTS_FROM: ${{ vars.STATS_COSTS_FROM_DEV }}
        run: site/scripts/collect-stats.sh costs dev store

      - name: Commit what changed
        id: commit
        working-directory: store
        run: |
          mkdir -p stats
          git add -A stats
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What this run wrote, to sign before it's pushed, each named by its
          # path (stats__costs__dev__2026-11.json), so no two share a name.
          mkdir -p "$RUNNER_TEMP/written"
          git diff --cached --name-only --diff-filter=AM | while read -r f; do
            cp "$f" "$RUNNER_TEMP/written/${f//\//__}"
          done
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "stats: $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Signed first: a file is pushed only once it's signed.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.commit.outputs.changed == 'true'
        with:
          subject-path: ${{ runner.temp }}/written/*.json

      - name: Push to the data branch
        id: save
        working-directory: store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" != true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push -q "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail if a read failed
        if: >-
          steps.prod-creds.outcome == 'failure' || steps.prod-counts.outcome == 'failure' ||
          steps.prod-costs.outcome == 'failure' || steps.dev-creds.outcome == 'failure' ||
          steps.dev-costs.outcome == 'failure'
        run: |
          echo "A read failed (see the steps above); what the others read was saved."
          exit 1

  publish:
    name: Show them on the site
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Redeploy the site
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
