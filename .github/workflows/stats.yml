# Collects the app's public statistics into this repository's `data`
# branch, signs every file it writes, and redeploys the site, whose Stats
# page shows them (scripts/build-stats.sh).
#
# Every hour, the counts of the last 48 hours (scripts/collect-stats.sh
# counts); once a day, also the costs (Cost Explorer charges $0.01 a call).
# It reads AWS through read-only roles that only this repository's `stats`
# environment may assume (the code repository's
# infra/init/stats_reader.tf), which takes only main. Without a role's
# secret, that account is skipped.
#
# Anyone can check a file of the data branch:
#
#   gh attestation verify <file> --repo incognitochat-web/website \
#     --cert-identity https://github.com/incognitochat-web/website/.github/workflows/stats.yml@refs/heads/main
#
# Only scheduled and manual runs: the role trusts any job in the stats
# environment, so this workflow must never run on pull_request_target,
# workflow_run or issue_comment.
name: Collect statistics

on:
  schedule:
    - cron: '25 * * * *'
    - cron: '50 5 * * *'
  workflow_dispatch:
    inputs:
      costs:
        description: Also read costs (Cost Explorer charges $0.01 a call)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stats
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      COSTS: ${{ github.event.schedule == '50 5 * * *' || inputs.costs == true }}
      HAS_PRODUCTION: ${{ secrets.STATS_ROLE_ARN_PRODUCTION != '' }}
      HAS_DEV: ${{ secrets.STATS_ROLE_ARN_DEV != '' }}
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: store

      - name: Production credentials
        if: env.HAS_PRODUCTION == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.STATS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ vars.STATS_REGION_PRODUCTION }}
          role-session-name: website-stats

      - name: Production counts
        if: env.HAS_PRODUCTION == 'true'
        env:
          NAMESPACE: ${{ vars.STATS_NAMESPACE_PRODUCTION }}
        run: site/scripts/collect-stats.sh counts store

      - name: Production costs
        if: env.HAS_PRODUCTION == 'true' && env.COSTS == 'true'
        run: site/scripts/collect-stats.sh costs production store

      - name: Dev credentials
        if: env.HAS_DEV == 'true' && env.COSTS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.STATS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.STATS_REGION_DEV }}
          role-session-name: website-stats

      - name: Dev costs
        if: env.HAS_DEV == 'true' && env.COSTS == 'true'
        run: site/scripts/collect-stats.sh costs dev store

      - name: Save to the data branch
        id: save
        working-directory: store
        run: |
          git add -A stats
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What this run wrote, for the attestation below.
          mkdir -p "$RUNNER_TEMP/written"
          git diff --cached --name-only --diff-filter=AM | while read -r f; do
            mkdir -p "$RUNNER_TEMP/written/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/written/$f"
          done
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "stats: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.save.outputs.changed == 'true'
        with:
          subject-path: ${{ runner.temp }}/written/**/*.json

  publish:
    name: Show them on the site
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Redeploy the site
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
