<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "favicon.svg" | relURL }}" alt="" width="28" height="28">
      <span>{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="{{ i18n "nav" }}">
      <ul>
        {{- range slice "official" "verify" "status" }}
          {{- with site.GetPage . }}
          <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
          {{- end }}
        {{- end }}
      </ul>
    </nav>
    <div class="header-tools">
      <a class="icon-link" href="https://github.com/{{ site.Params.codeRepo }}" target="_blank" rel="noopener noreferrer" title="{{ i18n "githubTitle" }}" aria-label="{{ i18n "githubTitle" }} {{ i18n "newTab" }}">{{ partial "icon.html" "github" }}</a>
      {{- range .Translations }}
      <a class="lang-switch" href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}">{{ .Language.Label }}</a>
      {{- end }}
    </div>
  </div>
</header>
