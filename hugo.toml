baseURL = "https://incognitochat.me/"
title = "Incognito Chat"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true
disableHugoGeneratorInject = true
# Nothing in the output may depend on the build's time, git, or the machine:
# CI builds twice and fails if the two differ.
enableGitInfo = false
buildDrafts = false
buildFuture = false

[markup.goldmark.renderer]
unsafe = true # only our own content; needed for small inline SVGs and <abbr>

[markup.goldmark.parser.attribute]
block = true

# No syntax highlighting: it writes inline styles, which the site's
# Content-Security-Policy refuses.
[markup.highlight]
codeFences = false

# Each language: its name in itself, locale, direction, order, and the
# fonts its pages preload (static/fonts/<name>.woff2). scripts/check.sh
# fails if a page or an i18n key is missing in one of them.
[languages.en]
label = "English"
locale = "en"
direction = "ltr"
weight = 1
[languages.en.params]
fonts = ["inter", "newsreader"]

[languages.fa]
label = "فارسی"
locale = "fa"
direction = "rtl"
weight = 2
[languages.fa.params]
fonts = ["inter", "vazirmatn-arabic"]

[languages.ru]
label = "Русский"
locale = "ru"
direction = "ltr"
weight = 3
[languages.ru.params]
# Russian text uses the system's fonts (site.css); the site's name and
# numbers use Newsreader.
fonts = ["newsreader"]

[languages.ar]
label = "العربية"
locale = "ar"
direction = "rtl"
weight = 4
[languages.ar.params]
fonts = ["inter", "vazirmatn-arabic"]

[languages.nl]
label = "Nederlands"
locale = "nl"
direction = "ltr"
weight = 5
[languages.nl.params]
fonts = ["inter", "newsreader"]

[languages.es]
label = "Español"
locale = "es"
direction = "ltr"
weight = 6
[languages.es.params]
fonts = ["inter", "newsreader"]

[languages.pt-br]
label = "Português (Brasil)"
locale = "pt-BR"
direction = "ltr"
weight = 7
[languages.pt-br.params]
fonts = ["inter", "newsreader"]

[languages.id]
label = "Bahasa Indonesia"
locale = "id"
direction = "ltr"
weight = 8
[languages.id.params]
fonts = ["inter", "newsreader"]

[sitemap]
changeFreq = ""
priority = -1

# Everything about the production deployment lives here, in one place.
[params]
  botUsername = "IncognitoChat_app_Bot"
  appName = "app"
  appOrigin = "https://incognitochat.github.io"
  codeRepo = "incognitochat/incognitochat"
  hostingRepo = "incognitochat/incognitochat.github.io"
  siteRepo = "incognitochat-web/website"
  signerIdentity = "https://github.com/incognitochat/incognitochat.github.io/.github/workflows/deploy.yml@refs/heads/main"

  contactEmail = "contact@incognitochat.me"
  securityEmail = "security@incognitochat.me"
  privacyEmail = "privacy@incognitochat.me"

  # The Stats page shows messages and media from the first hour production
  # counted them (UTC, yyyy-mm-ddThh): v2.7.0 went live at 03:01 UTC on
  # 2026-11-22. Earlier hours show as not counted. Empty: "counted from the
  # next release".
  [params.statsCountedFrom]
    messages = "2026-11-22T03"
    media = "2026-11-22T03"
